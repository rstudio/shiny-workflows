name: 'Update LICENSE.note'
description: 'Regenerate the bundled JavaScript dependency list in `LICENSE.note`.'

inputs:
  path:
    description: 'Path to the license note file, relative to `working-directory`.'
    default: "LICENSE.note"
    required: false
  check:
    description: "If `'true'`, only check that the license note is up to date."
    default: "false"
    required: false
  working-directory:
    description: 'Directory containing the license note file, relative to the root of the repository.'
    default: "."
    required: false
  js-working-directory:
    description: 'Directory containing `package.json`, relative to the root of the repository. Defaults to `working-directory`.'
    default: ""
    required: false
  comment:
    description: "If `'true'`, leave a comment on the pull request when the license note changes."
    default: "true"
    required: false
  token:
    description: 'Token used to write the pull request comment. Needs `pull-requests: write`.'
    default: ${{ github.token }}
    required: false

runs:
  using: "composite"
  steps:

    # This step spans two directories (the note lives in `working-directory`,
    # `node_modules` in `js-working-directory`), so rather than set a
    # `working-directory:` it runs from the repository root and resolves both
    # paths against `--root`.
    #
    # `node_modules` must already be installed; the license of each bundled
    # package is read from its installed `package.json`.
    - name: Update `LICENSE.note`
      id: license-note
      shell: bash
      env:
        NOTE_PATH: ${{ inputs.working-directory }}/${{ inputs.path }}
        JS_DIR: ${{ inputs.js-working-directory || inputs.working-directory }}
        CHECK: ${{ inputs.check }}
      run: |
        ARGS=(--root "$GITHUB_WORKSPACE" --path "$NOTE_PATH" --js-dir "$JS_DIR")
        if [ "$CHECK" = "true" ]; then
          ARGS+=(--check)
        fi
        node "$GITHUB_ACTION_PATH/license-note.mjs" "${ARGS[@]}"

    - name: Commit changes
      working-directory: ${{ inputs.working-directory }}
      if: inputs.check != 'true'
      shell: bash
      env:
        NOTE_PATH: ${{ inputs.path }}
      run: |
        git add -A "$NOTE_PATH" || echo "No changes found in $NOTE_PATH"
        git commit -m 'Update `LICENSE.note` (GitHub Actions)' || echo "No license note changes to commit"

    # A licensing change deserves a human's eyes, so say so on the PR. The
    # comment is keyed by a hidden marker and edited in place, so repeated runs
    # update one comment instead of stacking up new ones.
    - name: Comment on pull request
      if: >
        inputs.check != 'true'
        && inputs.comment == 'true'
        && steps.license-note.outputs.updated == 'true'
        && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        NOTE_PATH: ${{ inputs.working-directory }}/${{ inputs.path }}
        JS_DIR: ${{ inputs.js-working-directory || inputs.working-directory }}
      run: |
        MARKER='<!-- shiny-workflows:license-note -->'

        # Quoted heredoc so backticks and quotes survive verbatim; the two
        # paths are substituted afterwards.
        BODY="$(cat <<'EOF' | sed -e "s|__NOTE__|$NOTE_PATH|g" -e "s|__JS_DIR__|$JS_DIR|g"
        <!-- shiny-workflows:license-note -->
        ### `__NOTE__` was updated

        The bundled JavaScript dependency list in `__NOTE__` changed, and the update has been committed to this pull request. **Please check that the new list is correct** — it describes the licenses this package redistributes.

        The list is generated from `__JS_DIR__/package.json`. To control which packages are listed, set the `licenseNote.bundled` field to the packages this package actually bundles:

        ```json
        {
          "licenseNote": {
            "bundled": ["jquery", "bootstrap-datepicker"]
          }
        }
        ```

        Without that field the direct `dependencies` are listed, which is usually wrong for repos that bundle from `devDependencies`.

        Anything outside the generated block is never touched, so keep listing bundled code that does not come from npm by hand.

        <sub>Generated by <a href="https://github.com/rstudio/shiny-workflows/tree/v1/license-note"><code>rstudio/shiny-workflows/license-note</code></a>.</sub>
        EOF
        )"

        COMMENT_ID="$(
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty"
        )" || COMMENT_ID=""

        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" --silent \
            || echo "::warning::Could not update the existing license note comment."
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" --silent \
            || echo "::warning::Could not comment on the pull request. Does the token have 'pull-requests: write'?"
        fi
